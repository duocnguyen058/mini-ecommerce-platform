spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5433/ecommerce_db}
    username: ${PAYMENT_DB_USERNAME:ecommerce}
    password: ${PAYMENT_DB_PASSWORD:ecommerce_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8086}

jwt:
  public-key: ${JWT_PUBLIC_KEY:classpath:keys/public.pem}
  issuer: ${JWT_ISSUER:mini-ecommerce}

clients:
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8085}

zalopay:
  app-id: ${ZALOPAY_APP_ID:2553}
  key1: ${ZALOPAY_KEY1:PcY4iZIKFCIdgZvA6ueMcMHHUbRLYjPL}
  key2: ${ZALOPAY_KEY2:kLtgPl8YESDmyABkQgeZByOUJsbcpNI2}
  create-order-url: ${ZALOPAY_CREATE_URL:https://sb-openapi.zalopay.vn/v2/create}
  callback-url: ${ZALOPAY_CALLBACK_URL:http://localhost:8086/api/payment/zalopay/callback}
  app-user: mini-ecommerce

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
