spring:
  application:
    name: cart-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8084}

jwt:
  public-key: ${JWT_PUBLIC_KEY:classpath:keys/public.pem}
  issuer: ${JWT_ISSUER:mini-ecommerce}

cart:
  ttl-days: ${CART_TTL_DAYS:7}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
