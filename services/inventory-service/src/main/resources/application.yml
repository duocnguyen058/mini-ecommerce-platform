spring:
  application:
    name: inventory-service
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5433/inventory_db}
    username: ${INVENTORY_DB_USERNAME:ecommerce}
    password: ${INVENTORY_DB_PASSWORD:ecommerce_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ecommerce}
    password: ${RABBITMQ_PASSWORD:ecommerce_local}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8083}

jwt:
  public-key: ${JWT_PUBLIC_KEY:classpath:keys/public.pem}
  issuer: ${JWT_ISSUER:mini-ecommerce}

# URL catalog-service — dùng để verify productId khi admin tạo inventory item.
catalog-service:
  url: ${CATALOG_SERVICE_URL:http://catalog-service:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
