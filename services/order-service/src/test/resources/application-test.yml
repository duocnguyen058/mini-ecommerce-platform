spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

# OutboxPoller — chạy nhanh để test verify nhanh.
outbox:
  poll-interval-ms: 200
  batch-size: 10

# Resilience4j: cửa sổ nhỏ để test failure scenario nhanh.
resilience4j:
  circuitbreaker:
    instances:
      inventoryClient:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 2s
        sliding-window-size: 4
        minimum-number-of-calls: 2
        permitted-number-of-calls-in-half-open-state: 1
  retry:
    instances:
      inventoryClient:
        max-attempts: 2
        wait-duration: 100ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
