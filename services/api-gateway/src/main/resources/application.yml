spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:30s}
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth,/api/auth/**,/api/users,/api/users/**
            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/products,/api/products/**,/api/categories,/api/categories/**,/api/admin/products,/api/admin/products/**,/api/admin/categories,/api/admin/categories/**,/api/v1/brands,/api/v1/brands/**,/api/v1/products/**
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/inventory,/api/inventory/**,/api/admin/inventory,/api/admin/inventory/**,/api/v1/inventory,/api/v1/inventory/**
            - id: cart-service
              uri: ${CART_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/cart,/api/cart/**
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/checkout,/api/checkout/**,/api/orders,/api/orders/**,/api/admin/orders,/api/admin/orders/**,/api/coupons,/api/coupons/**,/api/admin/coupons,/api/admin/coupons/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/payment,/api/payment/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/notifications,/api/notifications/**,/api/v1/notifications,/api/v1/notifications/**,/api/v2/notifications,/api/v2/notifications/**

server:
  port: ${SERVER_PORT:8080}


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
